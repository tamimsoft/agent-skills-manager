[project]
name = "agent-skills-manager"
version = "0.1.0"
description = "Global agent skill manager for OpenCode, Junie, and Kilo"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
agent-skills = "agent_skills.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_skills = ["templates/*.md"]
